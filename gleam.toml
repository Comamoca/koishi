name = "koishi"
version = "1.0.1"
target = "javascript"

description = "Generate OG images from Lustre HTML trees, via @comamoca/komeiji and satori"
licences = ["MIT"]
repository = { type = "github", user = "Comamoca", repo = "koishi" }
links = [{ title = "GitHub", href = "https://github.com/Comamoca/koishi" }]

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[javascript]
runtime = "node"

[javascript.deno]
allow_env = ["NODE_ENV",  "JEST_WORKER_ID"]
allow_read = ["./node_modules/harfbuzzjs/hb.wasm", "gleam.toml", "test",  "node_modules/@fontsource/inter/files/inter-latin-400-normal.woff"]
